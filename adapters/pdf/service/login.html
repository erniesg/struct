<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pdf2epub</title>
<style>
  :root { color-scheme: light dark; --bg:#fbfaf7; --fg:#1b1a17; --muted:#6b6863;
          --line:#e2ded5; --card:#fff; --accent:#2f5d50; --bad:#a13d2d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16171a; --fg:#e9e6df; --muted:#9a978f; --line:#2c2e33;
            --card:#1e2024; --accent:#7fb3a1; --bad:#e08b78; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--fg); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  form { background:var(--card); border:1px solid var(--line); border-radius:10px;
         padding:1.6rem 1.7rem; width:min(24rem, 90vw); }
  h1 { font-size:1.15rem; margin:0 0 .3rem; }
  p { color:var(--muted); font-size:.87rem; margin:0 0 1.1rem; }
  input { width:100%; padding:.6rem .7rem; font:inherit; border-radius:7px;
          border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  button { margin-top:.8rem; width:100%; padding:.6rem; font:inherit; border-radius:7px;
           border:1px solid var(--accent); background:var(--accent); color:var(--card); cursor:pointer; }
  .err { color:var(--bad); font-size:.85rem; margin-top:.7rem; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>pdf2epub</h1>
  <p>This staging instance is token-gated. Paste the access token.</p>
  <input name="token" type="password" autocomplete="current-password" autofocus placeholder="access token">
  <button type="submit">Enter</button>
  <div class="err"><!--ERROR--></div>
</form>
</body>
</html>
