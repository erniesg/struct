# TLS front for the pdf2epub staging service.
# Matches the pattern the other services on this host already use: a sslip.io
# hostname, a Let's Encrypt certificate, and nothing but the app behind it.
#
# Substitute PDF2EPUB_HOST before installing (deploy.sh does this).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name PDF2EPUB_HOST;

    ssl_certificate /etc/letsencrypt/live/PDF2EPUB_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PDF2EPUB_HOST/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # a PDF upload is the only large body this service ever accepts
    client_max_body_size 45m;
    client_body_timeout 300s;

    # the app is token-gated; this is a second, cheap gate in front of it
    limit_req zone=pdf2epub burst=20 nodelay;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8010/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name PDF2EPUB_HOST;
    return 301 https://$host$request_uri;
}
