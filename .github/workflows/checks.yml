name: checks

# What a reviewer can rely on without taking anyone's word for it. The corpus
# measurement (four sets, ~1.9 GB of PDFs, Docling's layout models, ~40 min)
# cannot run here and stays a local gate; everything below can and does.
#
# Actions are pinned to full commit SHAs with the tag in a trailing comment:
# this repository requires it, and a tag is a moving target an upstream owner
# can repoint at any commit.
on:
  pull_request:
  push:
    branches: [main, 'fable/**']

jobs:
  package:
    name: package (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # a shared runner is slower than a laptop: the codec suite times out at
      # vitest's 5s default here, so CI gives it room rather than pretending
      - run: npm test -- --testTimeout=30000
      - run: npm run build
      - run: npm run test:source-boundary
      # `test:package` is deliberately not run here: scripts/test-packed-consumer.mjs
      # installs the tarball with `npm install --offline`, which needs a warm npm
      # cache that a fresh runner does not have (ENOTCACHED). It stays a local check
      # until the script can populate its own cache.

  adapter:
    name: pdf adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      # The adapter declares docling (and so torch) as a runtime dependency,
      # but imports it lazily: the test suite never reaches that import, so
      # CI installs the light half and stays under a minute instead of
      # pulling ~700 MB of CUDA wheels onto a CPU runner.
      # six tests shell out to poppler (pdftoppm) to raster a page; without it
      # they raise SourceRasterError rather than skip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m pip install --upgrade pip
      - run: pip install docling-core pypdf pillow pypdfium2 latex2mathml
      - name: the adapter is not allowed to import docling at module level
        run: python scripts/check-lazy-imports.py
      # the suite is discovered from the adapter directory: `tests/` carries no
      # __init__.py, so it is not importable as a package from the repo root
      - run: python -m unittest discover -s tests
        working-directory: adapters/pdf
